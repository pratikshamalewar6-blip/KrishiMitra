# ======================================================
# KrishiMitra - Training Configuration
# ======================================================

# ------------------------------------------------------
# Global Training Settings
# ------------------------------------------------------

training:
  random_seed: 42

  device: auto

  epochs: 30

  batch_size: 16

  num_workers: 2

  learning_rate: 0.0001

  weight_decay: 0.0001

  validation_split: 0.15

  test_split: 0.15

# ------------------------------------------------------
# Optimizer
# ------------------------------------------------------

optimizer:
  name: AdamW

  betas: [0.9, 0.999]

# ------------------------------------------------------
# Learning Rate Scheduler
# ------------------------------------------------------

scheduler:
  name: CosineAnnealingLR

  T_max: 30

  eta_min: 0.000001

# ------------------------------------------------------
# Early Stopping
# ------------------------------------------------------

early_stopping:
  enabled: true

  patience: 7

  monitor: validation_loss

# ------------------------------------------------------
# Checkpointing
# ------------------------------------------------------

checkpoint:
  save_best_only: true

  save_last: true

  monitor: validation_accuracy

# ------------------------------------------------------
# TensorBoard
# ------------------------------------------------------

tensorboard:
  enabled: true

# ------------------------------------------------------
# Data Augmentation
# ------------------------------------------------------

augmentation:
  horizontal_flip: true

  vertical_flip: false

  rotation: 20

  brightness: 0.2

  contrast: 0.2

  blur: true

# ------------------------------------------------------
# Evaluation Metrics
# ------------------------------------------------------

metrics:
  top_k: [1, 5]

  confusion_matrix: true

  classification_report: true

  precision: true

  recall: true

  f1_score: true

# ------------------------------------------------------
# Logging
# ------------------------------------------------------

logging:
  log_interval: 10

  save_training_curves: true
